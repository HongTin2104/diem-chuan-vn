[project]
name = "diem-chuan-vn"
version = "0.1.1"
description = "Open, multi-year dataset of Vietnamese university admission cut-off scores, with a source link for every row."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HongTin2104" }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
app = ["streamlit>=1.48", "altair>=5"]
notebook = ["jupyter", "matplotlib>=3.10"]
export = ["pyarrow>=15"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=4",
    "streamlit>=1.48",
    "altair>=5",
    "pyarrow>=15",
]

[project.scripts]
diem-chuan-validate = "diem_chuan.validate:main"
diem-chuan-suggest = "diem_chuan.query:main"
diem-chuan-export = "diem_chuan.export:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diem_chuan = ["dataset_card.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["diem_chuan", "app"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ['if __name__ == "__main__":']
