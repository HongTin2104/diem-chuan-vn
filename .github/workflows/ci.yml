name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Validate data/
        run: python -m diem_chuan.validate
      # Reviewers see which score files a pull request touches without opening the diff.
      - name: Data changes in this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          {
            echo "### Data changes"
            echo
            echo "| File | Lines added | Lines removed |"
            echo "|---|---:|---:|"
            git diff --numstat FETCH_HEAD -- data/ | awk '{print "| " $3 " | " $1 " | " $2 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Fails below the fail_under threshold in pyproject.toml.
      - run: pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t diem-chuan-vn .
      - name: Check the data inside the image
        run: docker run --rm diem-chuan-vn python -m diem_chuan.validate
